version: 2
updates:
  # Single workspace-root entry: merchant/, explorer/web/, and explorer/api/
  # share one pnpm-lock.yaml. Per-subdirectory entries fight over that lockfile
  # (each PR updates its own package.json without seeing the others), so
  # Dependabot must be pointed at the workspace root to update it correctly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/explorer/indexer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
